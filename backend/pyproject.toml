[project]
name = "book-embeddings-ingestion"
version = "0.1.0"
description = "A system for ingesting book content, generating embeddings, and storing them in a vector database"
authors = [{name = "Aliza Moin", email = "aliza.moin18@example.com"}]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "cohere>=5.5.0",
    "qdrant-client>=1.8.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-mock>=3.11.1",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
book-ingest = "src.cli.main:main"